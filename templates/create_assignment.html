{% extends 'base.html' %}{% block title %}Create assignment | StudentEval AI{% endblock %}{% block content %}<section class="form-page form-page-wide"><p class="eyebrow">Teacher workspace</p><h1>Create assignment</h1><form method="post" class="form-stack"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="form-grid"><label>Assignment title<input name="title" maxlength="180" required></label><label>Subject or category<input name="subject" maxlength="120" value="General"></label><label>Passing score<input name="passing_score" type="number" min="0" max="100" value="90" required></label></div><label>Task description<textarea name="description" rows="4" required></textarea></label><label>Required features<textarea name="requirements" rows="3"></textarea></label><label>Student instructions<textarea name="instructions" rows="3"></textarea></label><label>Expected output<textarea name="expected_output" rows="3"></textarea></label><label>Reference solution<textarea name="reference_solution" rows="4"></textarea></label><label>Test cases<textarea name="test_cases" rows="3"></textarea></label><label>Rubric weights as JSON <span class="field-hint">Weights should total 100</span><textarea name="rubric_json" rows="5" spellcheck="false">{{ default_rubric|tojson(indent=2) }}</textarea></label><button class="button button-primary" type="submit">Save assignment</button></form></section>{% endblock %}
