{% extends 'base.html' %}{% block title %}Sign in | StudentEval AI{% endblock %}{% block content %}
<section class="form-page"><p class="eyebrow">Welcome back</p><h1>Sign in</h1><p class="muted">Use your registered email and password.</p><form method="post" class="form-stack"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Email address<input name="email" type="email" autocomplete="email" required></label><label>Password<input name="password" type="password" autocomplete="current-password" required></label><button class="button button-primary" type="submit">Sign in</button></form><p class="form-note">New to StudentEval AI? <a href="{{ url_for('auth.register') }}">Create an account</a></p></section>{% endblock %}
