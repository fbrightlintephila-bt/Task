{% extends 'base.html' %}{% block title %}Create account | StudentEval AI{% endblock %}{% block content %}
<section class="form-page"><p class="eyebrow">Student access</p><h1>Create account</h1><p class="muted">Teacher accounts are created by an authorized setup command.</p><form method="post" class="form-stack"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Full name<input name="full_name" autocomplete="name" maxlength="120" required></label><label>Student ID<input name="student_id" maxlength="80" required></label><label>Email address<input name="email" type="email" autocomplete="email" required></label><label>Password <span class="field-hint">10+ characters</span><input name="password" type="password" autocomplete="new-password" minlength="10" required></label><label>Confirm password<input name="confirm_password" type="password" autocomplete="new-password" minlength="10" required></label><button class="button button-primary" type="submit">Create student account</button></form><p class="form-note">Already registered? <a href="{{ url_for('auth.login') }}">Sign in</a></p></section>{% endblock %}
